actor:
  config:
    max_phase: 4
  plugin: phase
algorithm:
- config:
    cycle: '90'
    green: '45'
    interval: 20
    max_lanelinks: 27
    num_phase: 5
    device: cpu
  plugin: fixed_time
components:
  actor:
  - phase
  algorithm:
  - fixed_time
  environment:
  - sumo
  observer:
  - standard
  orchestrator:
  - rule
  reward:
  - composite
  tracker:
  - csv
environment:
  config:
    decision_interval: 5
    flow_file: D:/dachuang/sumo/ModuTSC_new/data/monaco/flow_0.rou.xml
    gui: false
    max_lanelinks: 27
    min_green: 5
    num_phase: 5
    roadnet_file: D:/dachuang/sumo/ModuTSC_new/data/monaco/roadnet.net.xml
    sim_max_time: 3600
    sumo_cfg: ''
    yellow_duration: 3
  plugin: sumo
evaluation:
  checkpoint_dir: checkpoints/paper_fixedtime/
  eval_frequency: 5
  eval_steps: 500
experiment:
  name: paper-fixedtime-1780151705437
  seed: 42
observer:
  config:
    features:
    - num
    - waiting
    history: 1
    max_lanelinks: 27
    normalize: true
    num:
      clip_max: 5
      clip_min: 0
      div: 10
    num_phase: 5
    prepend_phase: <self.__prepend_phase__>
    speed:
      clip_max: 2
      clip_min: 0
      div: 15
    wait_time:
      clip_max: 5
      clip_min: 0
      div: 100
    waiting:
      clip_max: 5
      clip_min: 0
      div: 5
  plugin: standard
orchestrator:
  config: {}
  plugin: rule
reward:
  config:
    metrics:
      waiting: -1
    reward_norm: 1
