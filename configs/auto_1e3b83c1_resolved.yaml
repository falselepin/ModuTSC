actor:
  config:
    max_phase: 4
  plugin: phase
algorithm:
- config:
    device: cpu
collector:
  config:
    batch_size: 64
    capacity: 100000
    per_agent: false
  plugin: replay
components:
  actor:
  - phase
  algorithm:
  - max_pressure
  collector:
  - replay
  environment:
  - sumo
  observer:
  - flat_lane
  reward:
  - composite
environment:
  config:
    decision_interval: 5
    flow_file: D:/dachuang/sumo/ModuTSC_new/data/Monaco/flow_0.rou.xml
    gui: false
    max_lanelinks: 27
    min_green: 5
    num_phase: 5
    roadnet_file: D:/dachuang/sumo/ModuTSC_new/data/Monaco/roadnet.net.xml
    sim_max_time: 3600
    sumo_cfg: ''
    yellow_duration: 3
  plugin: sumo
evaluation:
  checkpoint_dir: checkpoints/max_pressure_reproduce/
  eval_frequency: 1
  eval_steps: 500
experiment:
  name: scaffold_exp
  seed: 42
observer:
  config:
    features: <self.__default_features__>
    max_lanelinks: 27
    num:
      clip_max: 5
      clip_min: 0
      div: 10
    num_phase: 5
    prepend_phase: <self.__prepend_phase__>
    speed:
      clip_max: 2
      clip_min: 0
      div: 15
    wait_time:
      clip_max: 5
      clip_min: 0
      div: 100
    waiting:
      clip_max: 5
      clip_min: 0
      div: 5
  plugin: flat_lane
orchestrator:
  config: {}
  plugin: rule
reward:
  config:
    metrics:
      waiting: -1
    reward_norm: 1
  plugin: composite
tracker:
  config:
    sumo_episode_kpis: true
  plugin: console
training:
  episodes_per_epoch: 1
  num_epochs: 1
  warmup_steps: 0
