# FRAP + independent 编排器（每路口独立网络，无通信，IQL 风格）
# 结构对齐平台 scaffold_config / auto_*_resolved.yaml；运行后 Launcher 会生成 frap_independent_resolved.yaml
experiment:
  name: "frap_independent_LosAngeles"
  seed: 42

components:
  environment: [sumo]
  observer: [frap]
  actor: [phase]
  reward: [composite]
  collector: [replay]
  algorithm: [frap]
  orchestrator: [independent]
  tracker: [console]

environment:
  plugin: "sumo"
  config:
    roadnet_file: "data/LosAngeles/roadnet.net.xml"
    flow_file: "data/LosAngeles/flow_0.rou.xml"
    gui: false
    sim_max_time: 3600
    decision_interval: 5
    yellow_duration: 3
    min_green: 5
    num_phase: 5
    max_lanelinks: 45

observer:
  plugin: "frap"
  config:
    features: ["num"]
    num_phase: 5
    max_lanelinks: 45
    norm: {}

actor:
  plugin: "phase"
  config:
    max_phase: 5

reward:
  plugin: "composite"
  config:
    metrics:
      waiting: -1.0
    reward_norm: 1.0

collector:
  plugin: "replay"
  config:
    capacity: 50000
    batch_size: 32
    per_agent: true

algorithm:
  - plugin: "frap"
    config:
      device: "cpu"
      lr: 0.0005
      gamma: 0.95
      tau: 0.01
      num_phase: 5
      max_lanelinks: 45
      frap_tls_id: null
      phase_2_passable_lanelink: null

orchestrator:
  plugin: "independent"
  config:
    learn_every: 1
    sync_every: 100
    max_decision_steps: 0
    train_log_interval_sim_sec: 300
    epsilon: 1.0
    epsilon_min: 0.01
    epsilon_decay: 0.995

tracker:
  plugin: "console"
  config: {}

training:
  warmup_steps: 200
  num_epochs: 5
  episodes_per_epoch: 2

evaluation:
  eval_frequency: 5
  eval_steps: 200
  checkpoint_dir: "checkpoints/frap_independent_LosAngeles/"
